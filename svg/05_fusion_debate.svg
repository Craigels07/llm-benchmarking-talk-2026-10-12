<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <style>
    .f{font-family:'Play','Trebuchet MS','Segoe UI',system-ui,sans-serif}
    .sh{filter:drop-shadow(2px 2px 4px rgba(0,0,0,.8))}
    .card{fill:rgba(8,12,18,0.78);stroke-width:3}
    .lbl{font-size:34px;letter-spacing:3px;fill:#e6edf3}
    .sub{font-size:23px;fill:rgba(230,237,243,0.55)}
    .hdr{font-size:32px;letter-spacing:4px}
    .wire{fill:none;stroke:rgba(230,237,243,0.28);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .cross{fill:none;stroke:rgba(230,237,243,0.18);stroke-width:3;stroke-linecap:round}
  </style>

  <defs>
    <marker id="a-grey" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="rgba(230,237,243,0.55)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="a-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#a371f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#d29922" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" rx="24" fill="#0d1117"/>

  <!-- title -->
  <text class="f sh" x="960" y="100" font-size="44" letter-spacing="6" fill="#e6edf3" text-anchor="middle" dominant-baseline="central">FUSION: THREE MODELS, TWO ROUNDS, ONE VERDICT</text>

  <!-- column headers -->
  <text class="f sh hdr" x="735" y="225" fill="#e6edf3" text-anchor="middle" dominant-baseline="central">ROUND 1</text>
  <text class="f sub" x="735" y="262" text-anchor="middle" dominant-baseline="central">blind, in parallel</text>
  <text class="f sh hdr" x="1115" y="225" fill="#e6edf3" text-anchor="middle" dominant-baseline="central">ROUND 2</text>
  <text class="f sub" x="1115" y="262" text-anchor="middle" dominant-baseline="central">each reads the other two</text>

  <!-- query -->
  <rect class="card" x="60" y="480" width="200" height="120" rx="16" stroke="rgba(230,237,243,0.35)"/>
  <text class="f lbl" x="160" y="525" text-anchor="middle" dominant-baseline="central">QUERY</text>
  <text class="f sub" x="160" y="565" text-anchor="middle" dominant-baseline="central">to the agent</text>

  <path class="wire" d="M 260 540 H 310" marker-end="url(#a-grey)"/>

  <!-- scout -->
  <rect class="card" x="320" y="480" width="200" height="120" rx="16" stroke="rgba(230,237,243,0.35)"/>
  <text class="f lbl" x="420" y="525" text-anchor="middle" dominant-baseline="central">SCOUT</text>
  <text class="f sub" x="420" y="565" text-anchor="middle" dominant-baseline="central">shared facts</text>

  <!-- fan out -->
  <path class="wire" d="M 520 540 H 570"/>
  <path class="wire" d="M 570 540 V 360 H 610" style="stroke:#58a6ff" marker-end="url(#a-blue)"/>
  <path class="wire" d="M 570 540 H 610" style="stroke:#3fb950" marker-end="url(#a-green)"/>
  <path class="wire" d="M 570 540 V 720 H 610" style="stroke:#a371f7" marker-end="url(#a-purple)"/>

  <!-- round 1 -->
  <g>
    <rect class="card" x="620" y="300" width="230" height="120" rx="16" stroke="#58a6ff"/>
    <text class="f lbl" x="735" y="345" text-anchor="middle" dominant-baseline="central">MODEL A</text>
    <text class="f sub" x="735" y="385" text-anchor="middle" dominant-baseline="central">GPT</text>
  </g>
  <g>
    <rect class="card" x="620" y="480" width="230" height="120" rx="16" stroke="#3fb950"/>
    <text class="f lbl" x="735" y="525" text-anchor="middle" dominant-baseline="central">MODEL B</text>
    <text class="f sub" x="735" y="565" text-anchor="middle" dominant-baseline="central">Grok</text>
  </g>
  <g>
    <rect class="card" x="620" y="660" width="230" height="120" rx="16" stroke="#a371f7"/>
    <text class="f lbl" x="735" y="705" text-anchor="middle" dominant-baseline="central">MODEL C</text>
    <text class="f sub" x="735" y="745" text-anchor="middle" dominant-baseline="central">Claude</text>
  </g>

  <!-- debate: every round 2 model reads all three round 1 answers -->
  <path class="cross" d="M 850 360 L 990 540"/>
  <path class="cross" d="M 850 360 L 990 720"/>
  <path class="cross" d="M 850 540 L 990 360"/>
  <path class="cross" d="M 850 540 L 990 720"/>
  <path class="cross" d="M 850 720 L 990 360"/>
  <path class="cross" d="M 850 720 L 990 540"/>
  <path class="wire" d="M 850 360 H 990" style="stroke:#58a6ff" marker-end="url(#a-blue)"/>
  <path class="wire" d="M 850 540 H 990" style="stroke:#3fb950" marker-end="url(#a-green)"/>
  <path class="wire" d="M 850 720 H 990" style="stroke:#a371f7" marker-end="url(#a-purple)"/>

  <!-- round 2: same model per row -->
  <g>
    <rect class="card" x="1000" y="300" width="230" height="120" rx="16" stroke="#58a6ff"/>
    <text class="f lbl" x="1115" y="345" text-anchor="middle" dominant-baseline="central">MODEL A</text>
    <text class="f sub" x="1115" y="385" text-anchor="middle" dominant-baseline="central">rebuttal</text>
  </g>
  <g>
    <rect class="card" x="1000" y="480" width="230" height="120" rx="16" stroke="#3fb950"/>
    <text class="f lbl" x="1115" y="525" text-anchor="middle" dominant-baseline="central">MODEL B</text>
    <text class="f sub" x="1115" y="565" text-anchor="middle" dominant-baseline="central">rebuttal</text>
  </g>
  <g>
    <rect class="card" x="1000" y="660" width="230" height="120" rx="16" stroke="#a371f7"/>
    <text class="f lbl" x="1115" y="705" text-anchor="middle" dominant-baseline="central">MODEL C</text>
    <text class="f sub" x="1115" y="745" text-anchor="middle" dominant-baseline="central">rebuttal</text>
  </g>

  <!-- fan in -->
  <path class="wire" d="M 1230 360 H 1280 V 540" style="stroke:#58a6ff"/>
  <path class="wire" d="M 1230 720 H 1280 V 540" style="stroke:#a371f7"/>
  <path class="wire" d="M 1230 540 H 1280" style="stroke:#3fb950"/>
  <path class="wire" d="M 1280 540 H 1320" marker-end="url(#a-grey)"/>

  <!-- architect -->
  <rect class="card" x="1330" y="460" width="260" height="160" rx="18" stroke="#d29922" stroke-width="4"/>
  <text class="f sh lbl" x="1460" y="520" fill="#d29922" text-anchor="middle" dominant-baseline="central">ARCHITECT</text>
  <text class="f sub" x="1460" y="562" text-anchor="middle" dominant-baseline="central">weighs both</text>
  <text class="f sub" x="1460" y="592" text-anchor="middle" dominant-baseline="central">rounds</text>

  <path class="wire" d="M 1590 540 H 1640" style="stroke:#d29922" marker-end="url(#a-amber)"/>

  <!-- verdict -->
  <rect class="card" x="1650" y="480" width="220" height="120" rx="16" stroke="#d29922"/>
  <text class="f lbl" x="1760" y="525" text-anchor="middle" dominant-baseline="central">VERDICT</text>
  <text class="f sub" x="1760" y="565" text-anchor="middle" dominant-baseline="central">ranked, credited</text>

  <!-- debate brace under the two rounds -->
  <path class="wire" d="M 620 850 V 870 H 1230 V 850"/>
  <text class="f" x="925" y="920" font-size="30" letter-spacing="4" fill="rgba(230,237,243,0.5)" text-anchor="middle" dominant-baseline="central">DEBATE</text>
</svg>
